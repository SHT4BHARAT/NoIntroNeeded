# Publishes the official Ruby SDK (sdk/ruby) to RubyGems.
#
# Usage:
#   1. On rubygems.org → Profile → Edit → API Access, create a key with `gem push` scope.
#   2. Add it as a repository secret named RUBYGEMS_API_KEY.
#   3. Trigger manually (Actions → Publish Ruby SDK) or push a tag matching `ruby/*`.
name: Publish Ruby SDK to RubyGems

on:
  workflow_dispatch:
  push:
    tags:
      - "ruby/*"

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ruby
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Build gem
        run: gem build shivanshu-sdk.gemspec

      - name: Publish gem
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          mkdir -p "$HOME/.gem"
          printf -- "---\n:rubygems_api_key: %s\n" "$RUBYGEMS_API_KEY" > "$HOME/.gem/credentials"
          chmod 600 "$HOME/.gem/credentials"
          gem push shivanshu-sdk-*.gem