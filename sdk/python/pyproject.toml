[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shivanshu-sdk"
version = "1.0.0"
description = "Official Python SDK for Shivanshu Tiwari Portfolio APIs, project intelligence, and autonomous agent evaluation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Shivanshu Tiwari", email = "sht4bharat@gmail.com" }
]
keywords = ["shivanshutiwari", "sdk", "api-client", "ai-agents", "mcp", "portfolio"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.urls]
Homepage = "https://shivanshutiwari.in"
Documentation = "https://shivanshutiwari.in/developers/sdk"
Repository = "https://github.com/SHT4BHARAT/portfolio"
